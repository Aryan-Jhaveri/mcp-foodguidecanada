[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foodguide"
version = "0.1.0"
description = "Canada's Food Guide CLI and MCP server, backed by offline data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.9.0",
    "fastmcp>=2.3.0",
    "httpx>=0.23.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.25.0",
    "typer>=0.12.0",
    "uvicorn>=0.15.0",
]

[project.scripts]
foodguide = "foodguide.cli:main"
foodguide-mcp = "foodguide.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foodguide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Slow, network-dependent tests: the live 141-page recipes crawl and the
    # live DRI/EER snapshot comparisons. CI runs `pytest -m "not live"`;
    # the data-refresh workflow runs `pytest -m live`. FOODGUIDE_SKIP_LIVE_TESTS=1
    # additionally skips the live tests inside a `-m live` run.
    "live: fetches live canada.ca pages (full recipes crawl / live snapshot tests)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    # Most of this codebase is legacy (pre-package) code with long data-table
    # lines and long URLs; new code keeps to the 100-char limit. Do not churn.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# server.py sets warnings filters before importing fastmcp on purpose
# (warnings must be configured before pydantic is imported).
"src/foodguide/server.py" = ["E402"]
