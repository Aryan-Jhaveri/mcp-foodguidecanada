[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foodguide"
version = "0.1.0"
description = "Canada's Food Guide CLI and MCP server, backed by offline data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.9.0",
    "fastmcp>=2.3.0",
    "httpx>=0.23.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.25.0",
    "typer>=0.12.0",
    "uvicorn>=0.15.0",
]

[project.scripts]
foodguide = "foodguide.cli:main"
foodguide-mcp = "foodguide.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foodguide"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
