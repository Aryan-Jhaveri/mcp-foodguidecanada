<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><title>Test oat bowl - Canada.ca</title></head>
<body>
<main>
  <hgroup id="wb-cont" class="cfg-print">
    <p>Canada's <span class="nowrap">food guide</span></p>
    <h1>Test oat bowl</h1>
  </hgroup>
  <div>
    <p>A quick breakfast bowl for busy mornings.</p>
    <div class="row">
      <div class="col-xs-4 text-center brdr-rght"><span class="fas fa-clock fa-2x"></span><br><strong>Prep time</strong><br>10 min</div>
      <div class="col-xs-4 text-center"><span class="fas fa-utensils fa-2x"></span><br><strong>Servings</strong><br>2</div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6">
      <h2 class="brdr-bttm mrgn-tp-0 h3">Ingredients</h2>
      <ul>
        <li>250 mL (1 cup) rolled oats</li>
        <li>250 mL (1 cup) milk</li>
        <li>1 apple, diced</li>
      </ul>
      <h2 class="brdr-bttm h3">Directions</h2>
      <ol class="lst-spcd">
        <li>Stir the oats and milk together in a bowl.</li>
        <li>Top with the diced apple and serve.</li>
      </ol>
    </div>
  </div>
</main>
</body>
</html>
